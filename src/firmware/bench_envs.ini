; One PlatformIO environment per module: each one was compiled alone against this firmware (2026-11-24).
; Rule found while testing: list ONLY the libraries the module needs, or the build fails on SPI.h.
; Each environment needs its own small main in src/bench/<name>.cpp (written with its lesson).
[env:bench_level]
extends = env:esp32dev
lib_deps = 
build_src_filter = -<*> +<bench/level.cpp> +<e1_sensors/LevelSwitch.cpp>

[env:bench_temp]
extends = env:esp32dev
lib_deps = 
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
build_src_filter = -<*> +<bench/temp.cpp> +<e1_sensors/TemperatureSensor.cpp>

[env:bench_ads]
extends = env:esp32dev
lib_deps = 
    adafruit/Adafruit ADS1X15@^2.5.0
build_src_filter = -<*> +<bench/ads.cpp> +<e1_sensors/Ads1115Bus.cpp>

[env:bench_ph]
extends = env:esp32dev
lib_deps = 
    adafruit/Adafruit ADS1X15@^2.5.0
build_src_filter = -<*> +<bench/ph.cpp> +<e1_sensors/PhSensor.cpp> +<e1_sensors/Ads1115Bus.cpp>

[env:bench_flow]
extends = env:esp32dev
lib_deps = 
build_src_filter = -<*> +<bench/flow.cpp> +<e1_sensors/FlowSensor.cpp>

[env:bench_sim]
extends = env:esp32dev
lib_deps = 
build_src_filter = -<*> +<bench/sim.cpp> +<e1_sensors/SimulatedSensors.cpp>

[env:bench_led]
extends = env:esp32dev
lib_deps = 
build_src_filter = -<*> +<bench/led.cpp> +<p3_outputs/StatusLed.cpp>

[env:bench_onoff]
extends = env:esp32dev
lib_deps = 
build_src_filter = -<*> +<bench/onoff.cpp> +<p3_outputs/AeratorDriver.cpp> +<p3_outputs/HeaterDriver.cpp> +<p3_outputs/LowSideSwitch.cpp>

[env:bench_pump]
extends = env:esp32dev
lib_deps = 
build_src_filter = -<*> +<bench/pump.cpp> +<p3_outputs/PumpDriver.cpp>

[env:bench_dose]
extends = env:esp32dev
lib_deps = 
build_src_filter = -<*> +<bench/dose.cpp> +<p3_outputs/DosingPumpDriver.cpp> +<p3_outputs/LowSideSwitch.cpp>

[env:bench_rail]
extends = env:esp32dev
lib_deps = 
    adafruit/Adafruit ADS1X15@^2.5.0
build_src_filter = -<*> +<bench/rail.cpp> +<p3_outputs/RailMonitor.cpp> +<e1_sensors/Ads1115Bus.cpp>
