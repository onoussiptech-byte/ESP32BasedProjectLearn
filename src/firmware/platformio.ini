; =============================================================================
; AQUA-NODE firmware - Smart Aquaponics, Local-Control Edition (MISAP phase 1)
; PlatformIO project configuration file
; https://docs.platformio.org/page/projectconf.html
; =============================================================================

[platformio]
default_envs = esp32dev                       ; build the real-hardware target by default

; ---- Settings shared by every environment -----------------------------------
[env]
platform = espressif32@8.0.0                  ; pinned: Arduino core 3.x (ledcAttach and the watchdog API need it)
board = esp32dev                              ; ESP32 DevKit V1 (30 pin, ESP32-WROOM-32)
framework = arduino                           ; Arduino core on top of ESP-IDF + FreeRTOS
monitor_speed = 115200                        ; serial monitor baud rate (matches Serial.begin)
monitor_filters = esp32_exception_decoder     ; decode crash back-traces in the monitor
board_build.partitions = huge_app.csv         ; 3 MB app partition: Wi-Fi + Bluetooth need the room
build_flags =
    -I src                                    ; lets modules include "e1_sensors/..." style paths
    -Wall                                     ; enable the common compiler warnings
lib_deps =
    bblanchon/ArduinoJson@^7.2.0              ; JSON command parsing (ICD section 4.4)
    adafruit/Adafruit ADS1X15@^2.5.0          ; 16-bit ADC driver for the pH channel
    paulstoffregen/OneWire@^2.3.8             ; 1-Wire bus driver for the DS18B20
    milesburton/DallasTemperature@^3.11.0     ; DS18B20 temperature sensor driver

; ---- Real hardware: Wi-Fi access point AQUA-NODE + Bluetooth serial ----------
[env:esp32dev]
build_flags =
    ${env.build_flags}                        ; inherit the shared flags
    -DSIM_MODE=0                              ; real sensors, soft-AP and Bluetooth
    -DBENCH_MODE=1                            ; short pH mixing wait (set 0 on the water rig)

; ---- Simulation (Wokwi/Velxio): station Wi-Fi, fake sensors, JSON over Serial -
[env:esp32dev_sim]
build_flags =
    ${env.build_flags}                        ; inherit the shared flags
    -DSIM_MODE=1                              ; simulated pH/temperature/flow plant model
    -DBENCH_MODE=1                            ; short pH mixing wait in simulation

; ---- Wokwi with real E1 drivers: station Wi-Fi + serial JSON, sensors read the
; ---- diagram parts (DS18B20, pH pot on GPIO 35, clock generator on GPIO 34)
[env:esp32dev_wokwi]
build_flags =
    ${env.build_flags}                        ; inherit the shared flags
    -DSIM_MODE=1                              ; no soft-AP / Bluetooth (not simulated)
    -DSIM_SENSORS=0                           ; real sensor drivers instead of the plant model
    -DBENCH_MODE=1                            ; short pH mixing wait in simulation
