<script>/* store.js - accounts, sessions, scoring and device-to-device carrying for ESP32 Tour.
 * Only Dashboard, Basic Concepts (t1) and FreeRTOS/Linking/PlatformIO (t2) exist, so every
 * quiz id, score, mark and percentage is derived from those tabs in course.js. */
(function () {
  'use strict';

  const LS_DB = 'esp32tour.db.v1', LS_SESSION = 'esp32tour.session', LS_THROTTLE = 'esp32tour.throttle';
  const PW_ITER = 100000, REC_ITER = 20000, ATTEMPT_CAP = 300;
  const COURSE = window.ESP32TOUR_COURSE;
  const RULES = COURSE.rules, VERSION = COURSE.app.version;

  // ------------------------------------------------------------------ course helpers
  const quizzes = [];                       // every quiz of tabs t1 and t2
  const quizById = {};
  const lessonList = [];                    // {key:'t1.l01', tab, num, title, subs}
  COURSE.tabs.filter((tb) => tb.lessons).forEach((tb) => {
    tb.lessons.forEach((ls, li) => {
      const key = tb.id + '.' + ls.id;
      lessonList.push({ key, tab: tb.id, num: li + 1, title: ls.title, subs: ls.subs });
      for (let s = 1; s <= ls.subs; s++) {
        const q = { qid: key + '.s' + String(s).padStart(2, '0'), tab: tb.id, lesson: key, kind: 'sub', n: s,
          max: RULES.sub_quiz.questions };
        quizzes.push(q); quizById[q.qid] = q;
      }
      const f = { qid: key + '.final', tab: tb.id, lesson: key, kind: 'final', n: 0, max: RULES.final_quiz.questions };
      quizzes.push(f); quizById[f.qid] = f;
    });
  });

  // FAILED / TO DO / DONE are decided from the BEST mark of a quiz
  function statusOf(kind, best) {
    if (best == null) return 'new';
    const r = kind === 'final' ? RULES.final_quiz : RULES.sub_quiz;
    if (best <= r.failed_max) return 'failed';
    if (best <= r.todo_max) return 'todo';
    return 'done';
  }

  const Course = {
    quizzes, quizById, lessonList, statusOf,
    tabs: COURSE.tabs, rules: RULES,
    tab: (id) => COURSE.tabs.find((tb) => tb.id === id),
    ranges(kind) {
      const r = kind === 'final' ? RULES.final_quiz : RULES.sub_quiz, max = r.questions;
      return { failed: [0, r.failed_max], todo: [r.failed_max + 1, r.todo_max], done: [r.done_min, max] };
    },
    maxScore: quizzes.reduce((a, q) => a + q.max, 0)
  };

  // ------------------------------------------------------------------ persistence
  const listeners = [];
  let db = { format: 1, accounts: [], deleted: [] };
  let sessionUid = null;
  let folderFile = null, folderTimer = null;
  let storageOk = true;
  let loadedVersionNote = null;

  const readLS = (k) => { try { return localStorage.getItem(k); } catch (e) { storageOk = false; return null; } };
  const writeLS = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { storageOk = false; return false; } };
  const delLS = (k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } };

  const emit = (what) => listeners.forEach((fn) => { try { fn(what); } catch (e) { console.error(e); } });
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function persist() {
    writeLS(LS_DB, JSON.stringify(db));
    if (folderFile) {
      clearTimeout(folderTimer);
      folderTimer = setTimeout(() => writeFolder().catch(() => { folderFile = null; }), 400);
    }
  }

  function validAccount(a) {
    return a && typeof a === 'object' && typeof a.uid === 'string' && typeof a.id === 'string' &&
      typeof a.first === 'string' && typeof a.last === 'string' && typeof a.salt === 'string' &&
      typeof a.hash === 'string' && typeof a.iter === 'number';
  }

  function normalise(a) {
    a.results = a.results && typeof a.results === 'object' ? a.results : {};
    a.attempts = Array.isArray(a.attempts) ? a.attempts : [];
    a.lang = a.lang === 'fr' ? 'fr' : 'en';
    a.theme = ['auto', 'light', 'dark'].includes(a.theme) ? a.theme : 'auto';
    a.pwdAt = a.pwdAt || 0; a.prefAt = a.prefAt || 0;
    return a;
  }

  function mergeAccount(loc, inc) {
    Object.keys(inc.results || {}).forEach((q) => {
      const l = loc.results[q], i = inc.results[q];
      if (!quizById[q] || !i) return;
      if (!l) { loc.results[q] = { ...i }; return; }
      l.best = Math.max(l.best, i.best);                       // best never goes down
      if ((i.at || 0) > (l.at || 0)) { l.latest = i.latest; l.at = i.at; }   // latest = most recent
      l.n = Math.max(l.n || 0, i.n || 0);
    });
    const seen = new Set(loc.attempts.map((x) => x.q + '|' + x.at));
    (inc.attempts || []).forEach((x) => { if (!seen.has(x.q + '|' + x.at)) loc.attempts.push(x); });
    loc.attempts.sort((x, y) => x.at - y.at);
    if (loc.attempts.length > ATTEMPT_CAP) loc.attempts = loc.attempts.slice(-ATTEMPT_CAP);
    if ((inc.pwdAt || 0) > (loc.pwdAt || 0)) {                  // most recent password change wins
      Object.assign(loc, { salt: inc.salt, hash: inc.hash, iter: inc.iter, rec: inc.rec, pwdAt: inc.pwdAt });
    }
    if ((inc.prefAt || 0) > (loc.prefAt || 0)) Object.assign(loc, { lang: inc.lang, theme: inc.theme, prefAt: inc.prefAt });
  }

  // Merge accounts from a file (copied folder or exported file) into this device
  function mergeIn(data) {
    const r = { added: 0, merged: 0, conflicts: 0 };
    const gone = new Set(db.deleted);
    (data.deleted || []).forEach((u) => { if (!gone.has(u)) { db.deleted.push(u); gone.add(u); } });
    db.accounts = db.accounts.filter((a) => !gone.has(a.uid));
    (data.accounts || []).filter(validAccount).forEach((inc) => {
      if (gone.has(inc.uid)) return;
      const loc = db.accounts.find((a) => a.uid === inc.uid);
      if (loc) { mergeAccount(loc, normalise(clone(inc))); r.merged++; return; }
      const copy = normalise(clone(inc));
      if (db.accounts.some((a) => a.id.toLowerCase() === copy.id.toLowerCase())) { copy.needsNewId = true; r.conflicts++; }
      db.accounts.push(copy); r.added++;
    });
    return r;
  }

  function dataObject() {
    return { format: 1, app: VERSION, savedAt: Date.now(), accounts: db.accounts, deleted: db.deleted };
  }
  // "<" is escaped so typed names can never end an inline script block in the single-file copy
  const dataFileText = () => 'window.ESP32TOUR_DATA=' + JSON.stringify(dataObject()).replace(/</g, '\\u003c') + ';\n';

  function parseDataText(text) {
    let s = String(text).trim();
    s = s.replace(/^window\.ESP32TOUR_DATA\s*=\s*/, '').replace(/;\s*$/, '');
    const o = JSON.parse(s);
    if (!o || !Array.isArray(o.accounts)) throw new Error('bad file');
    return o;
  }

  async function writeFolder() {
    const w = await folderFile.createWritable();
    await w.write(dataFileText());
    await w.close();
  }

  function download(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // ------------------------------------------------------------------ validation + throttling
  const ID_RE = /^[A-Za-z0-9._-]{3,24}$/;
  const norm = (s) => String(s || '').trim();
  const byId = (id) => db.accounts.filter((a) => a.id.toLowerCase() === norm(id).toLowerCase());

  function throttleState() { try { return JSON.parse(readLS(LS_THROTTLE) || '{}'); } catch (e) { return {}; } }
  function waitSeconds(id) {
    const e = throttleState()[norm(id).toLowerCase()];
    return e && e.until > Date.now() ? Math.ceil((e.until - Date.now()) / 1000) : 0;
  }
  function recordFailure(id) {
    const st = throttleState(), k = norm(id).toLowerCase(), e = st[k] || { n: 0, until: 0 };
    e.n += 1;
    if (e.n >= 3) e.until = Date.now() + Math.min(60, Math.pow(2, e.n - 2)) * 1000;
    st[k] = e; writeLS(LS_THROTTLE, JSON.stringify(st));
  }
  function clearFailures(id) {
    const st = throttleState(); delete st[norm(id).toLowerCase()]; writeLS(LS_THROTTLE, JSON.stringify(st));
  }

  async function verify(acc, password) {
    return (await CryptoX.derive(password, acc.salt, acc.iter)) === acc.hash;
  }

  // The unique-password rule: true when ANY other account already uses this password
  async function passwordInUse(password, exceptUid) {
    for (const a of db.accounts) {
      if (a.uid !== exceptUid && await verify(a, password)) return true;
    }
    return false;
  }

  async function setPassword(acc, password) {
    acc.salt = CryptoX.randomHex(16); acc.iter = PW_ITER;
    acc.hash = await CryptoX.derive(password, acc.salt, PW_ITER);
    acc.pwdAt = Date.now();
  }

  async function newRecovery(acc) {
    const code = CryptoX.recoveryCode();
    const salt = CryptoX.randomHex(16);
    acc.rec = { salt, iter: REC_ITER, hash: await CryptoX.derive(code.replace(/-/g, ''), salt, REC_ITER) };
    return code;
  }

  // ------------------------------------------------------------------ public store
  const Store = {
    Course, VERSION,
    get storageOk() { return storageOk; },
    get versionNote() { return loadedVersionNote; },
    on(fn) { listeners.push(fn); },

    init() {
      try { const raw = readLS(LS_DB); if (raw) { const o = JSON.parse(raw); if (o && Array.isArray(o.accounts)) db = { format: 1, accounts: o.accounts, deleted: o.deleted || [] }; } }
      catch (e) { console.warn('stored accounts unreadable', e); }
      db.accounts.forEach(normalise);
      const file = window.ESP32TOUR_DATA;
      this.foundFromFile = 0;
      if (file && Array.isArray(file.accounts) && file.accounts.length) {
        const before = db.accounts.length;
        mergeIn(file);
        this.foundFromFile = db.accounts.length - before;
        if (file.app && file.app !== VERSION) loadedVersionNote = file.app;
      }
      persist();
      let uid = null;
      try { uid = sessionStorage.getItem(LS_SESSION); } catch (e) { /* ignore */ }
      if (!uid) uid = readLS(LS_SESSION);
      sessionUid = db.accounts.some((a) => a.uid === uid) ? uid : null;
    },

    accounts: () => db.accounts.slice(),
    hasAccounts: () => db.accounts.length > 0,
    current: () => db.accounts.find((a) => a.uid === sessionUid) || null,
    findById: (id) => byId(id),
    validateId(id) { const v = norm(id); if (!v) return 'err.required'; return ID_RE.test(v) ? null : 'err.id.format'; },
    idTaken(id, exceptUid) { return byId(id).some((a) => a.uid !== exceptUid); },
    waitSeconds, passwordInUse,

    async createAccount({ id, first, last, password, lang }) {
      const acc = normalise({
        uid: CryptoX.randomHex(12), id: norm(id), first: norm(first), last: norm(last),
        created: Date.now(), lang: lang || 'en', theme: 'auto', results: {}, attempts: []
      });
      await setPassword(acc, password);
      const code = await newRecovery(acc);
      db.accounts.push(acc); persist(); emit('accounts');
      return { account: acc, recovery: code };
    },

    startSession(uid, keep) {
      sessionUid = uid;
      try { sessionStorage.setItem(LS_SESSION, uid); } catch (e) { /* ignore */ }
      if (keep) writeLS(LS_SESSION, uid); else delLS(LS_SESSION);
      const acc = this.current();
      if (acc) I18n.set(acc.lang);
      emit('session');
    },

    async signIn(id, password) {
      const wait = waitSeconds(id);
      if (wait) return { ok: false, err: 'err.wait', vars: { s: wait } };
      for (const a of byId(id)) {
        if (await verify(a, password)) { clearFailures(id); return { ok: true, account: a }; }
      }
      recordFailure(id);
      const w2 = waitSeconds(id);
      return w2 ? { ok: false, err: 'err.wait', vars: { s: w2 } } : { ok: false, err: 'err.login' };
    },

    async verifyAccount(uid, password) {
      const a = db.accounts.find((x) => x.uid === uid);
      if (!a) return false;
      const wait = waitSeconds(a.id);
      if (wait) return { wait };
      const ok = await verify(a, password);
      if (ok) clearFailures(a.id); else recordFailure(a.id);
      return ok;
    },

    signOut() {
      sessionUid = null;
      try { sessionStorage.removeItem(LS_SESSION); } catch (e) { /* ignore */ }
      delLS(LS_SESSION);
      emit('session');
    },

    async changePassword(uid, oldPw, newPw) {
      const a = db.accounts.find((x) => x.uid === uid);
      if (!a || !(await verify(a, oldPw))) return { ok: false, err: 'err.pw.old' };
      if (await passwordInUse(newPw, uid)) return { ok: false, err: 'err.pw.used' };
      await setPassword(a, newPw); persist(); emit('accounts');
      return { ok: true };
    },

    async resetWithRecovery(id, code, newPw) {
      const wait = waitSeconds(id);
      if (wait) return { ok: false, err: 'err.wait', vars: { s: wait } };
      const clean = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      for (const a of byId(id)) {
        if (a.rec && (await CryptoX.derive(clean, a.rec.salt, a.rec.iter)) === a.rec.hash) {
          if (await passwordInUse(newPw, a.uid)) return { ok: false, err: 'err.pw.used' };
          await setPassword(a, newPw);
          const fresh = await newRecovery(a);
          clearFailures(id); persist(); emit('accounts');
          return { ok: true, account: a, recovery: fresh };
        }
      }
      recordFailure(id);
      return { ok: false, err: 'err.recovery' };
    },

    async deleteAccount(uid, password) {
      const a = db.accounts.find((x) => x.uid === uid);
      if (!a || !(await verify(a, password))) return { ok: false, err: 'err.pw.old' };
      db.accounts = db.accounts.filter((x) => x.uid !== uid);
      if (!db.deleted.includes(uid)) db.deleted.push(uid);
      persist();
      if (sessionUid === uid) this.signOut(); else emit('accounts');
      return { ok: true };
    },

    changeId(uid, newId) {
      const a = db.accounts.find((x) => x.uid === uid);
      const bad = this.validateId(newId);
      if (bad) return { ok: false, err: bad };
      if (this.idTaken(newId, uid)) return { ok: false, err: 'err.id.taken' };
      a.id = norm(newId); delete a.needsNewId; persist(); emit('accounts');
      return { ok: true };
    },

    setPrefs(uid, patch) {
      const a = db.accounts.find((x) => x.uid === uid);
      if (!a) return;
      Object.assign(a, patch); a.prefAt = Date.now();
      persist(); emit('prefs');
    },

    /* Record a finished quiz attempt. mark = number of correct answers.
       Score uses the BEST mark per quiz; Total mark uses the LATEST mark per quiz. */
    recordAttempt(uid, qid, mark) {
      const a = db.accounts.find((x) => x.uid === uid), q = quizById[qid];
      if (!a || !q || !Number.isInteger(mark) || mark < 0 || mark > q.max) return null;
      const before = this.stats(a);
      const r = a.results[qid] || { best: -1, latest: 0, n: 0, at: 0 };
      const prevStatus = statusOf(q.kind, r.best < 0 ? null : r.best);
      r.n += 1; r.at = Date.now(); r.latest = mark; r.best = Math.max(r.best, mark);
      a.results[qid] = r;
      a.attempts.push({ q: qid, m: mark, at: r.at });
      if (a.attempts.length > ATTEMPT_CAP) a.attempts = a.attempts.slice(-ATTEMPT_CAP);
      persist();
      const after = this.stats(a);
      emit('results');
      return {
        qid, mark, max: q.max, best: r.best, status: statusOf(q.kind, r.best), prevStatus,
        scoreDelta: after.total.score - before.total.score,
        markDelta: after.total.mark - before.total.mark
      };
    },

    /* Everything the header and Dashboard show, for one account */
    stats(acc) {
      const blank = () => ({ quizzes: 0, passed: 0, score: 0, mark: 0, max: 0, counts: { new: 0, todo: 0, failed: 0, done: 0 } });
      const out = { total: blank(), tabs: {}, lessons: {} };
      COURSE.tabs.filter((tb) => tb.lessons).forEach((tb) => { out.tabs[tb.id] = blank(); });
      lessonList.forEach((l) => { out.lessons[l.key] = { subs: l.subs, subsDone: 0, final: 'new', started: false, state: 'new' }; });
      quizzes.forEach((q) => {
        const res = acc && acc.results[q.qid];
        const st = statusOf(q.kind, res ? res.best : null);
        [out.total, out.tabs[q.tab]].forEach((b) => {
          b.quizzes++; b.max += q.max; b.counts[st]++;
          if (st === 'done') b.passed++;
          if (res) { b.score += res.best; b.mark += res.latest; }
        });
        const ls = out.lessons[q.lesson];
        if (res) ls.started = true;
        if (q.kind === 'sub' && st === 'done') ls.subsDone++;
        if (q.kind === 'final') ls.final = st;
      });
      Object.values(out.lessons).forEach((ls) => {
        ls.state = (ls.subsDone === ls.subs && ls.final === 'done') ? 'done' : ls.started ? 'progress' : 'new';
      });
      const pct = (b) => (b.quizzes ? (b.passed / b.quizzes) * 100 : 0);
      out.total.pct = pct(out.total);
      Object.values(out.tabs).forEach((b) => { b.pct = pct(b); });
      return out;
    },

    // ---- moving between devices
    exportText: dataFileText,
    exportDownload() { download('accounts.js', dataFileText()); },
    importText(text) {
      const data = parseDataText(text);
      const r = mergeIn(data);
      db.accounts.forEach(normalise);
      persist(); emit('accounts');
      return r;
    },
    get folderLinked() { return !!folderFile; },
    async saveToFolder() {
      if (!window.showDirectoryPicker) { download('accounts.js', dataFileText()); return 'download'; }
      try {
        const root = await window.showDirectoryPicker({ mode: 'readwrite' });
        const dir = await root.getDirectoryHandle('data', { create: true });
        folderFile = await dir.getFileHandle('accounts.js', { create: true });
        await writeFolder();
        return 'linked';
      } catch (e) {
        folderFile = null;
        return e && e.name === 'AbortError' ? 'cancel' : 'error';
      }
    },
    downloadAccountsFile() { download('accounts.js', dataFileText()); }
  };

  window.Store = Store;
  window.Course = Course;
})();
</script>
<script>/* ui.js - small UI kit: DOM helper, icons, status icons, rings, counters, toasts, modals, fields.
 * User-provided text is always inserted as text nodes, never as HTML. */
(function () {
  'use strict';

  const ICONS = window.ESP32TOUR_ICONS || {};
  const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    Object.keys(props || {}).forEach((k) => {
      const v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;              // only used with built-in SVG strings
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    const add = (c) => {
      if (c == null || c === false) return;
      if (Array.isArray(c)) c.forEach(add);
      else el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    };
    kids.forEach(add);
    return el;
  }

  function icon(name, cls) {
    const svg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
    return h('span', { class: 'ic' + (cls ? ' ' + cls : ''), html: svg });
  }

  // ---------------------------------------------------------------- status icons
  const lastStatus = {};                       // key -> last shown status, to animate only changes
  const STATUS_SVG = {
    new: '<circle class="s-ring" cx="12" cy="12" r="9"/>',
    todo: '<circle class="s-ring" cx="12" cy="12" r="9"/><path class="s-half" d="M12 3a9 9 0 0 1 0 18z"/>',
    done: '<circle class="s-disc" cx="12" cy="12" r="10"/><path class="s-check" d="M7.5 12.5l3 3 6-6.5"/>',
    failed: '<circle class="s-disc" cx="12" cy="12" r="10"/><path class="s-cross" d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>'
  };

  function statusIcon(status, key, size) {
    const el = h('span', { class: 'st st-' + status, role: 'img', 'aria-label': t('status.' + status), title: t('status.' + status) });
    if (size) el.style.setProperty('--st-size', size + 'px');
    el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + STATUS_SVG[status] + '</svg>';
    if (key) {
      const prev = lastStatus[key];
      if (prev !== undefined && prev !== status && !reduced()) el.classList.add('anim');
      lastStatus[key] = status;
    }
    return el;
  }
  const statusLabel = (s) => t('status.' + s);

  // ---------------------------------------------------------------- counters and rings
  function fmt(n) { return I18n.num(n); }

  function counter(el, opts) {
    const o = opts || {};
    let cur = 0, raf = 0;
    const draw = (v) => { el.textContent = (o.format ? o.format(v) : fmt(Math.round(v))) + (o.suffix || ''); };
    draw(0);
    return {
      get value() { return cur; },
      set(to, instant) {
        cancelAnimationFrame(raf);
        const from = cur;
        if (instant || reduced() || from === to) { cur = to; draw(to); return; }
        const t0 = performance.now(), dur = 650;
        const step = (now) => {
          const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
          cur = from + (to - from) * e; draw(cur);
          if (p < 1) raf = requestAnimationFrame(step); else { cur = to; draw(to); }
        };
        raf = requestAnimationFrame(step);
      },
      redraw() { draw(cur); }
    };
  }

  function ring(o) {
    const size = o.size || 96, stroke = o.stroke || 10, r = (size - stroke) / 2, c = 2 * Math.PI * r;
    const label = h('span', { class: 'ring-label' });
    if (o.fontSize) label.style.fontSize = o.fontSize + 'px';
    const el = h('div', { class: 'ring', style: { width: size + 'px', height: size + 'px' }, role: 'img' },
      h('span', { html: '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
        '<circle class="ring-track" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke-width="' + stroke + '" fill="none"/>' +
        '<circle class="ring-val" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke-width="' + stroke + '" fill="none" ' +
        'stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + c + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/></svg>' }),
      label);
    if (o.color) el.style.setProperty('--ring-color', o.color);
    const val = el.querySelector('.ring-val');
    const cnt = counter(label, { suffix: o.noPercent ? '' : '%' });
    let pct = 0;
    return {
      el,
      get pct() { return pct; },
      set(p, instant) {
        pct = Math.max(0, Math.min(100, p));
        val.style.strokeDashoffset = String(c * (1 - pct / 100));
        cnt.set(Math.round(pct), instant);
        el.setAttribute('aria-label', t('header.progress') + ' ' + Math.round(pct) + '%');
      },
      redraw() { cnt.redraw(); }
    };
  }

  function floatDelta(anchor, text, up) {
    if (reduced()) return;
    const d = h('span', { class: 'delta ' + (up ? 'up' : 'down'), 'aria-hidden': 'true' }, text);
    anchor.appendChild(d);
    setTimeout(() => d.remove(), 1400);
  }

  // ---------------------------------------------------------------- toasts and modals
  // opts: {label, onClick, sticky} adds an action button (used for "Update available")
  function toast(msg, kind, opts) {
    const o = opts || {};
    const box = document.getElementById('toasts');
    const hide = () => { el.classList.remove('in'); setTimeout(() => el.remove(), 300); };
    const el = h('div', { class: 'toast ' + (kind || 'info'), role: 'status' },
      icon(kind === 'error' ? 'circle-alert' : o.label ? 'sparkles' : 'check'), h('span', null, msg),
      o.label ? h('button', { class: 'toast-action', type: 'button', onclick: () => { hide(); if (o.onClick) o.onClick(); } }, o.label) : null,
      o.sticky ? h('button', { class: 'toast-x', type: 'button', 'aria-label': t('common.close'), onclick: hide }, icon('x')) : null);
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    if (!o.sticky) setTimeout(hide, 3600);
  }

  function modal(o) {
    const prevFocus = document.activeElement;
    const close = () => {
      document.removeEventListener('keydown', onKey, true);
      back.classList.remove('in');
      setTimeout(() => back.remove(), 180);
      if (prevFocus && prevFocus.focus) prevFocus.focus();
      if (o.onClose) o.onClose();
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
      if (e.key === 'Tab') {                                    // keep focus inside the dialog
        const f = Array.from(card.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')).filter((x) => !x.disabled && x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    const closeBtn = h('button', { class: 'icon-btn', type: 'button', 'aria-label': t('common.close'), onclick: close }, icon('x'));
    const card = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': o.title },
      h('div', { class: 'modal-head' }, h('h2', null, o.title), closeBtn),
      h('div', { class: 'modal-body' }, o.body));
    const back = h('div', { class: 'modal-back', onmousedown: (e) => { if (e.target === back) close(); } }, card);
    document.body.appendChild(back);
    document.addEventListener('keydown', onKey, true);
    requestAnimationFrame(() => {
      back.classList.add('in');
      const first = card.querySelector('input,select,button:not(.icon-btn)');
      if (first) first.focus();
    });
    return { close, el: card };
  }

  // ---------------------------------------------------------------- form fields
  function field(o) {
    const id = 'f-' + Math.random().toString(36).slice(2, 8);
    const input = h('input', {
      id, name: o.name, type: o.type || 'text', autocomplete: o.autocomplete || 'off',
      value: o.value || '', placeholder: o.placeholder || '', maxlength: o.maxlength || 64,
      autocapitalize: 'none', spellcheck: 'false', 'aria-describedby': id + '-m'
    });
    const msg = h('div', { class: 'field-msg', id: id + '-m' }, o.hint || '');
    const wrap = h('div', { class: 'field' });
    const lab = h('label', { for: id }, o.label);
    let control = input;
    if (o.type === 'password') {
      const eye = h('button', { class: 'eye', type: 'button', 'aria-label': t('common.show'), tabindex: '-1' }, icon('eye'));
      eye.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        eye.replaceChildren(icon(show ? 'eye-off' : 'eye'));
        eye.setAttribute('aria-label', show ? t('common.hide') : t('common.show'));
      });
      control = h('div', { class: 'pw-wrap' }, input, eye);
    }
    wrap.append(lab, control, msg);
    const hint = o.hint || '';
    return {
      el: wrap, input,
      get value() { return input.value; },
      error(key, vars) {
        wrap.classList.add('invalid'); msg.textContent = key ? t(key, vars) : '';
        wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
      },
      clear() { wrap.classList.remove('invalid', 'shake'); msg.textContent = hint; }
    };
  }

  function button(label, o) {
    const x = o || {};
    const b = h('button', { type: x.type || 'button', class: 'btn ' + (x.kind || 'primary') + (x.block ? ' block' : ''), onclick: x.onclick },
      x.icon ? icon(x.icon) : null, h('span', null, label));
    b.setBusy = (on) => { b.disabled = on; b.classList.toggle('busy', on); };
    return b;
  }

  function langSwitch(onChange) {
    const wrap = h('div', { class: 'seg', role: 'group', 'aria-label': t('settings.language') });
    ['en', 'fr'].forEach((l) => {
      wrap.appendChild(h('button', {
        type: 'button', class: 'seg-btn' + (I18n.lang === l ? ' on' : ''), 'aria-pressed': String(I18n.lang === l),
        onclick: () => { if (I18n.lang !== l) onChange(l); }
      }, l === 'en' ? 'EN' : 'FR'));
    });
    return wrap;
  }

  function logo(small) {
    return h('div', { class: 'brand' + (small ? ' small' : '') },
      h('span', { class: 'brand-chip' }, icon('cpu')),
      h('span', { class: 'brand-text' },
        h('strong', null, t('app.short')),
        small ? null : h('small', null, I18n.pick(window.ESP32TOUR_COURSE.app.long_name))));
  }

  window.UI = { h, icon, statusIcon, statusLabel, counter, ring, floatDelta, toast, modal, field, button, langSwitch, logo, reduced, fmt };
})();
</script>
<script>/* auth.js - sign in, sign up (create account), forgot password, recovery code, new-ID screens. */
(function () {
  'use strict';
  const { h, icon, field, button, logo, langSwitch, toast } = UI;
  const root = () => document.getElementById('root');

  let current = null;            // {mode, opts} so a language change can redraw the same screen

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
    const ta = h('textarea', { style: { position: 'fixed', opacity: '0' } }); ta.value = text;
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  UI.copyText = copyText;

  function frame(card, opts) {
    const bullets = ['auth.b1', 'auth.b2', 'auth.b3'].map((k) => h('li', null, icon('check'), h('span', null, t(k))));
    const brand = h('aside', { class: 'auth-brand' },
      logo(false),
      h('h1', null, t('auth.tagline')),
      h('ul', { class: 'auth-points' }, bullets),
      h('div', { class: 'auth-chip-art', 'aria-hidden': 'true' }, icon('cpu')));
    const lang = langSwitch((l) => { I18n.set(l); Auth.show(current.mode, current.opts); });
    const main = h('main', { class: 'auth-main' },
      h('div', { class: 'auth-top' }, opts && opts.adding ? null : h('span'), lang),
      card,
      h('p', { class: 'auth-foot' }, t('footer.version', { v: Store.VERSION })));
    return h('div', { class: 'auth' }, brand, main);
  }

  function banner() {
    const parts = [];
    if (!Store.storageOk) parts.push(h('div', { class: 'notice warn' }, icon('circle-alert'), h('span', null, t('auth.nostorage'))));
    if (Store.foundFromFile) parts.push(h('div', { class: 'notice ok' }, icon('shield-check'), h('span', null, t('auth.found'))));
    return parts;
  }

  function importLink(opts) {
    const input = h('input', { type: 'file', accept: '.js,.json,.txt', class: 'sr-only', tabindex: '-1' });
    input.addEventListener('change', async () => {
      const f = input.files && input.files[0];
      if (!f) return;
      try {
        const r = Store.importText(await f.text());
        toast(t('auth.imported', { n: r.added, m: r.merged }));
        Auth.show(Store.hasAccounts() ? 'signin' : 'signup', opts);
      } catch (e) { toast(t('auth.import.bad'), 'error'); }
      input.value = '';
    });
    return h('div', null, input,
      h('button', { class: 'link-btn', type: 'button', onclick: () => input.click() }, icon('upload'), h('span', null, t('auth.import'))));
  }

  // ------------------------------------------------------------------ sign in
  function signin(opts) {
    const fId = field({ label: t('field.id'), name: 'id', autocomplete: 'username', maxlength: 24 });
    const fPw = field({ label: t('field.password'), name: 'password', type: 'password', autocomplete: 'current-password', maxlength: 128 });
    const keep = h('input', { type: 'checkbox', id: 'keep' });
    const err = h('div', { class: 'form-err', role: 'alert' });
    const btn = button(t('auth.signin.btn'), { type: 'submit', icon: 'log-in', block: true });
    const form = h('form', { class: 'auth-form', novalidate: true }, fId.el, fPw.el,
      h('div', { class: 'row-between' },
        h('label', { class: 'check', for: 'keep' }, keep, h('span', null, t('auth.keep'))),
        h('button', { class: 'link-btn', type: 'button', onclick: () => Auth.show('forgot', opts) }, t('auth.forgot'))),
      err, btn);

    const chips = Store.accounts().map((a) => h('button', {
      type: 'button', class: 'acct-chip', onclick: () => { fId.input.value = a.id; fPw.input.focus(); }
    }, h('span', { class: 'avatar' }, (a.first[0] || a.id[0]).toUpperCase()),
    h('span', { class: 'acct-chip-text' }, h('strong', null, a.first), h('small', null, a.id))));

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); fId.clear(); fPw.clear(); err.textContent = '';
      if (!fId.value.trim()) return fId.error('err.required');
      if (!fPw.value) return fPw.error('err.required');
      btn.setBusy(true);
      try {
        const r = await Store.signIn(fId.value, fPw.value);
        if (!r.ok) { err.textContent = t(r.err, r.vars); return; }
        if (r.account.needsNewId) return Auth.show('newid', { ...opts, account: r.account, keep: keep.checked });
        Store.startSession(r.account.uid, keep.checked);
        opts.onDone();
      } catch (ex) { err.textContent = t('err.generic'); console.error(ex); }
      finally { btn.setBusy(false); }
    });

    const card = h('section', { class: 'auth-card' },
      h('h2', null, t('auth.signin.title')), h('p', { class: 'sub' }, t('auth.signin.sub')),
      banner(), chips.length ? h('div', { class: 'acct-chips', 'aria-label': t('auth.device') }, chips) : null,
      form,
      h('p', { class: 'switch-line' }, t('auth.new') + ' ',
        h('button', { class: 'link-btn', type: 'button', onclick: () => Auth.show('signup', opts) }, t('auth.create'))),
      importLink(opts),
      opts.adding ? h('button', { class: 'link-btn muted', type: 'button', onclick: opts.onCancel }, t('common.cancel')) : null);
    return frame(card, opts);
  }

  // ------------------------------------------------------------------ sign up
  function signup(opts) {
    const fId = field({ label: t('field.id'), name: 'id', autocomplete: 'username', maxlength: 24, hint: t('hint.id') });
    const fFirst = field({ label: t('field.first'), name: 'first', autocomplete: 'given-name', maxlength: 60 });
    const fLast = field({ label: t('field.last'), name: 'last', autocomplete: 'family-name', maxlength: 60 });
    const fPw = field({ label: t('field.password'), name: 'password', type: 'password', autocomplete: 'new-password', maxlength: 128, hint: t('hint.password') });
    const fPw2 = field({ label: t('field.confirm'), name: 'confirm', type: 'password', autocomplete: 'new-password', maxlength: 128 });
    const err = h('div', { class: 'form-err', role: 'alert' });
    const btn = button(t('auth.signup.btn'), { type: 'submit', icon: 'user-plus', block: true });
    const form = h('form', { class: 'auth-form', novalidate: true },
      fId.el, h('div', { class: 'two' }, fFirst.el, fLast.el), fPw.el, fPw2.el, err, btn);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      [fId, fFirst, fLast, fPw, fPw2].forEach((f) => f.clear()); err.textContent = '';
      let bad = null;
      const fail = (f, key) => { if (!bad) { f.error(key); bad = f; } else f.error(key); };
      const idErr = Store.validateId(fId.value);
      if (idErr) fail(fId, idErr); else if (Store.idTaken(fId.value)) fail(fId, 'err.id.taken');
      if (!fFirst.value.trim()) fail(fFirst, 'err.required');
      if (!fLast.value.trim()) fail(fLast, 'err.required');
      if (fPw.value.length < 6) fail(fPw, 'err.pw.short');
      else if (fPw.value !== fPw2.value) fail(fPw2, 'err.pw.mismatch');
      if (bad) { bad.input.focus(); return; }
      btn.setBusy(true);
      try {
        if (await Store.passwordInUse(fPw.value)) { fPw.error('err.pw.used'); fPw.input.focus(); return; }
        const r = await Store.createAccount({ id: fId.value, first: fFirst.value, last: fLast.value, password: fPw.value, lang: I18n.lang });
        Auth.show('recovery', { ...opts, account: r.account, code: r.recovery, afterCreate: true });
      } catch (ex) { err.textContent = t('err.generic'); console.error(ex); }
      finally { btn.setBusy(false); }
    });

    const card = h('section', { class: 'auth-card wide' },
      h('h2', null, t('auth.signup.title')),
      h('p', { class: 'sub' }, opts.adding ? t('auth.adding') : t('auth.signup.sub')),
      banner(), form,
      Store.hasAccounts() ? h('p', { class: 'switch-line' }, t('auth.have') + ' ',
        h('button', { class: 'link-btn', type: 'button', onclick: () => Auth.show('signin', opts) }, t('auth.signin.link'))) : null,
      importLink(opts),
      opts.adding ? h('button', { class: 'link-btn muted', type: 'button', onclick: opts.onCancel }, t('common.cancel')) : null);
    return frame(card, opts);
  }

  // ------------------------------------------------------------------ recovery code (after sign up or reset)
  function recovery(opts) {
    const saved = h('input', { type: 'checkbox', id: 'saved' });
    const go = button(t('common.continue'), { icon: 'check', block: true });
    go.disabled = true;
    saved.addEventListener('change', () => { go.disabled = !saved.checked; });
    go.addEventListener('click', () => {
      if (opts.afterCreate) { Store.startSession(opts.account.uid, false); opts.onDone(); }
      else Auth.show('signin', opts);
    });
    const copy = h('button', { class: 'btn ghost', type: 'button' }, icon('copy'), h('span', null, t('common.copy')));
    copy.addEventListener('click', async () => {
      if (await copyText(opts.code)) { copy.lastChild.textContent = t('common.copied'); setTimeout(() => { copy.lastChild.textContent = t('common.copy'); }, 1600); }
    });
    const card = h('section', { class: 'auth-card' },
      h('div', { class: 'big-icon ok' }, icon('shield-check')),
      h('h2', null, t('auth.recovery.title')),
      h('p', { class: 'sub' }, opts.afterCreate ? t('auth.recovery.text') : t('auth.reset.done') + ' ' + t('auth.recovery.text')),
      h('div', { class: 'code-box', 'aria-label': t('field.recovery') }, opts.code), copy,
      h('label', { class: 'check', for: 'saved' }, saved, h('span', null, t('auth.recovery.saved'))),
      go);
    return frame(card, opts);
  }

  // ------------------------------------------------------------------ forgot password
  function forgot(opts) {
    const fId = field({ label: t('field.id'), name: 'id', autocomplete: 'username', maxlength: 24 });
    const fCode = field({ label: t('field.recovery'), name: 'code', maxlength: 24, placeholder: 'XXXX-XXXX-XXXX-XXXX' });
    const fPw = field({ label: t('field.newpass'), name: 'password', type: 'password', autocomplete: 'new-password', maxlength: 128, hint: t('hint.password') });
    const fPw2 = field({ label: t('field.confirm'), name: 'confirm', type: 'password', autocomplete: 'new-password', maxlength: 128 });
    const err = h('div', { class: 'form-err', role: 'alert' });
    const btn = button(t('auth.forgot.btn'), { type: 'submit', icon: 'key-round', block: true });
    const form = h('form', { class: 'auth-form', novalidate: true }, fId.el, fCode.el, fPw.el, fPw2.el, err, btn);
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); [fId, fCode, fPw, fPw2].forEach((f) => f.clear()); err.textContent = '';
      if (!fId.value.trim()) return fId.error('err.required');
      if (!fCode.value.trim()) return fCode.error('err.required');
      if (fPw.value.length < 6) return fPw.error('err.pw.short');
      if (fPw.value !== fPw2.value) return fPw2.error('err.pw.mismatch');
      btn.setBusy(true);
      try {
        const r = await Store.resetWithRecovery(fId.value, fCode.value, fPw.value);
        if (!r.ok) { if (r.err === 'err.pw.used') fPw.error(r.err); else err.textContent = t(r.err, r.vars); return; }
        Auth.show('recovery', { ...opts, account: r.account, code: r.recovery, afterCreate: false });
      } catch (ex) { err.textContent = t('err.generic'); console.error(ex); }
      finally { btn.setBusy(false); }
    });
    const card = h('section', { class: 'auth-card' },
      h('h2', null, t('auth.forgot.title')), h('p', { class: 'sub' }, t('auth.forgot.sub')), form,
      h('button', { class: 'link-btn', type: 'button', onclick: () => Auth.show('signin', opts) }, icon('log-in'), h('span', null, t('auth.signin.link'))));
    return frame(card, opts);
  }

  // ------------------------------------------------------------------ choose a new ID (copied account clashed)
  function newid(opts) {
    const fId = field({ label: t('field.id'), name: 'id', maxlength: 24, hint: t('hint.id') });
    const btn = button(t('common.continue'), { type: 'submit', block: true });
    const form = h('form', { class: 'auth-form', novalidate: true }, fId.el, btn);
    form.addEventListener('submit', (e) => {
      e.preventDefault(); fId.clear();
      const r = Store.changeId(opts.account.uid, fId.value);
      if (!r.ok) return fId.error(r.err);
      Store.startSession(opts.account.uid, !!opts.keep); opts.onDone();
    });
    const card = h('section', { class: 'auth-card' },
      h('h2', null, t('auth.newid.title')), h('p', { class: 'sub' }, t('auth.newid.text', { id: opts.account.id })), form);
    return frame(card, opts);
  }

  const SCREENS = { signin, signup, recovery, forgot, newid };

  const Auth = {
    show(mode, opts) {
      const o = opts || {};
      if ((mode === 'signin') && !Store.hasAccounts()) mode = 'signup';
      current = { mode, opts: o };
      document.title = t('app.short') + ' · ' + t(mode === 'signup' ? 'auth.signup.title' : 'auth.signin.title');
      const page = SCREENS[mode](o);
      root().replaceChildren(page);
      const first = page.querySelector('input:not([type=file]):not([type=checkbox])');
      if (first) first.focus({ preventScroll: true });
    }
  };
  window.Auth = Auth;
})();
</script>
<script>/* dashboard.js - the Dashboard page (the first tab). Mounted once; update() refreshes values with animation. */
(function () {
  'use strict';
  const { h, icon, ring, counter, statusIcon, floatDelta } = UI;
  const fmt = (n) => I18n.num(n);

  function quizLabel(qid) {
    const q = Course.quizById[qid]; if (!q) return qid;
    const l = Course.lessonList.find((x) => x.key === q.lesson);
    return q.tab.slice(1) + '.' + l.num + (q.kind === 'final' ? ' · ' + t('dash.final') : '.' + q.n);
  }

  function card(cls, title, ...kids) {
    return h('section', { class: 'card ' + cls }, title ? h('h3', { class: 'card-title' }, title) : null, kids);
  }

  function mount(cb) {
    const acct = Store.current();
    const el = h('div', { class: 'dash' });

    // ---------------------------------------------------------------- hero
    const initial = (acct.first.trim()[0] || acct.id[0]).toUpperCase();
    el.appendChild(h('section', { class: 'hero' },
      h('span', { class: 'avatar xl' }, initial),
      h('div', { class: 'hero-text' },
        h('h1', null, t('dash.welcome', { name: acct.first })),
        h('p', null, I18n.pick(window.ESP32TOUR_COURSE.app.long_name))),
      h('span', { class: 'pill' }, icon('user'), h('span', null, acct.id))));

    // ---------------------------------------------------------------- profile
    const row = (k, v, extra) => h('div', { class: 'kv' }, h('span', { class: 'k' }, k), h('span', { class: 'v' }, v, extra));
    const profile = card('c-profile', t('dash.profile'),
      row(t('dash.id'), acct.id), row(t('dash.first'), acct.first), row(t('dash.last'), acct.last),
      row(t('dash.password'), h('span', { class: 'dots', 'aria-label': t('dash.password') }, '••••••••')),
      h('p', { class: 'note' }, icon('lock'), h('span', null, t('dash.pw.note'))),
      h('button', { class: 'btn ghost sm', type: 'button', onclick: cb.onChangePassword }, icon('key-round'), h('span', null, t('dash.changepw'))));

    // ---------------------------------------------------------------- progress ring
    const bigRing = ring({ size: 150, stroke: 14, fontSize: 32 });
    const passedTxt = h('p', { class: 'center muted' });
    const progress = card('c-progress', t('dash.progress'), h('div', { class: 'center' }, bigRing.el),
      passedTxt, h('p', { class: 'center tiny muted' }, t('dash.progress.sub')));

    // ---------------------------------------------------------------- score
    const scoreNum = h('span', { class: 'big-num' });
    const scoreCnt = counter(scoreNum);
    const scoreOf = h('span', { class: 'of' });
    const scoreAnchor = h('div', { class: 'num-anchor' }, scoreNum, scoreOf);
    const score = card('c-score', t('dash.score'), scoreAnchor, h('p', { class: 'note' }, t('dash.score.sub')));

    // ---------------------------------------------------------------- total mark (horizontal bar)
    const markPct = h('span', { class: 'big-num blue' });
    const markCnt = counter(markPct, { suffix: ' %', format: (v) => (Math.round(v * 10) / 10).toLocaleString(I18n.lang === 'fr' ? 'fr-FR' : 'en-US', { maximumFractionDigits: 1, minimumFractionDigits: 0 }) });
    const markFill = h('div', { class: 'bar-fill' });
    const markFig = h('span', { class: 'fig' });
    const markAnchor = h('div', { class: 'num-anchor' }, markPct, markFig);
    const counts = h('div', { class: 'count-chips' });
    const mark = card('c-mark', t('dash.mark'), markAnchor,
      h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100' }, markFill),
      h('p', { class: 'note' }, t('dash.mark.sub')), counts);

    // ---------------------------------------------------------------- continue
    const cont = card('c-continue', t('dash.continue'));

    // ---------------------------------------------------------------- per section
    const tabCards = {};
    const sectionRow = h('div', { class: 'section-row' });
    Course.tabs.filter((tb) => tb.lessons).forEach((tb) => {
      const r = ring({ size: 84, stroke: 9, fontSize: 18 });
      const sc = h('b'), mk = h('b'), cnt1 = counter(sc), cnt2 = counter(mk);
      const fill = h('div', { class: 'bar-fill' });
      tabCards[tb.id] = { r, cnt1, cnt2, sc, mk, fill, of1: h('small'), of2: h('small') };
      sectionRow.appendChild(h('section', { class: 'card c-tab' },
        h('div', { class: 'tab-card-head' }, r.el,
          h('div', null, h('h3', { class: 'card-title tight' }, I18n.pick(tb.title)),
            h('p', { class: 'tiny muted', 'data-passed': tb.id }))),
        h('div', { class: 'mini-stats' },
          h('div', null, h('span', { class: 'tiny muted' }, t('dash.score')), h('div', null, sc, tabCards[tb.id].of1)),
          h('div', null, h('span', { class: 'tiny muted' }, t('dash.mark')), h('div', null, mk, tabCards[tb.id].of2))),
        h('div', { class: 'bar thin' }, fill)));
    });
    const bySection = h('div', { class: 'span-all' }, h('h3', { class: 'section-title' }, t('dash.pertab')), sectionRow);

    // ---------------------------------------------------------------- timeline
    const timeline = h('div', { class: 'timeline-wrap' });

    // ---------------------------------------------------------------- activity + recent
    const bars = h('div', { class: 'bars' });
    const activity = card('c-activity', t('dash.activity'), bars, h('p', { class: 'empty', 'data-empty': 'act' }, t('dash.activity.empty')));
    const recentList = h('ul', { class: 'recent' });
    const recent = card('c-recent', t('dash.recent'), recentList);

    // ---------------------------------------------------------------- legend
    function legendBlock(kind, title) {
      const rg = Course.ranges(kind);
      const rng = (a) => (a[0] === a[1] ? t('range.single', { a: a[0] }) : t('range.todo', { a: a[0], b: a[1] }));
      return h('div', { class: 'legend-block' }, h('h4', null, title),
        ['failed', 'todo', 'done'].map((s) => h('div', { class: 'legend-row' }, statusIcon(s), h('b', null, t('status.' + s)), h('span', null, rng(rg[s])))));
    }
    const legend = card('c-legend', t('dash.legend'),
      h('div', { class: 'legend-grid' }, legendBlock('sub', t('dash.legend.sub')), legendBlock('final', t('dash.legend.final')),
        h('div', { class: 'legend-block' }, h('h4', null, t('status.new')),
          h('div', { class: 'legend-row' }, statusIcon('new'), h('b', null, t('status.new')), h('span', null, '—')),
          h('p', { class: 'note' }, t('dash.legend.rules')))));

    el.append(h('div', { class: 'grid' }, profile, progress, score, mark, cont), bySection,
      h('div', { class: 'span-all' }, h('h3', { class: 'section-title' }, t('dash.timeline')), timeline),
      h('div', { class: 'grid two' }, activity, recent), legend);

    // ================================================================ update
    let first = true;
    function update() {
      const a = Store.current(); if (!a) return;
      const s = Store.stats(a), tot = s.total, instant = first;
      first = false;

      bigRing.set(tot.pct, instant);
      passedTxt.textContent = t('dash.passed', { n: fmt(tot.passed), m: fmt(tot.quizzes) });

      scoreCnt.set(tot.score, instant);
      scoreOf.textContent = ' / ' + fmt(tot.max);

      const mpct = tot.max ? (tot.mark / tot.max) * 100 : 0;
      markCnt.set(mpct, instant);
      markFill.style.width = mpct + '%';
      markFig.textContent = fmt(tot.mark) + ' / ' + fmt(tot.max);
      mark.querySelector('.bar').setAttribute('aria-valuenow', String(Math.round(mpct)));

      counts.replaceChildren(...['done', 'todo', 'failed', 'new'].map((st) =>
        h('span', { class: 'count-chip c-' + st }, statusIcon(st, 'count:' + st), h('b', null, fmt(tot.counts[st])), h('span', null, t('status.' + st)))));

      Object.keys(tabCards).forEach((id) => {
        const c = tabCards[id], b = s.tabs[id];
        c.r.set(b.pct, instant); c.cnt1.set(b.score, instant); c.cnt2.set(b.mark, instant);
        c.of1.textContent = ' / ' + fmt(b.max); c.of2.textContent = ' / ' + fmt(b.max);
        c.fill.style.width = (b.max ? (b.mark / b.max) * 100 : 0) + '%';
        el.querySelector('[data-passed="' + id + '"]').textContent = t('dash.passed', { n: fmt(b.passed), m: fmt(b.quizzes) });
      });

      // continue card
      const last = a.attempts[a.attempts.length - 1];
      cont.replaceChildren(h('h3', { class: 'card-title' }, t('dash.continue')),
        h('div', { class: 'cont-icon' }, icon('play')),
        h('p', { class: 'strong' }, last ? t('dash.continue.last', { q: quizLabel(last.q) }) : t('dash.continue.none')),
        h('p', { class: 'note' }, t('dash.continue.note')));

      // timeline
      timeline.replaceChildren(...Course.tabs.filter((tb) => tb.lessons).map((tb) => {
        const cards = Course.lessonList.filter((l) => l.tab === tb.id).map((l) => {
          const ls = s.lessons[l.key];
          const pct = ls.subs ? (ls.subsDone / ls.subs) * 100 : 0;
          return h('article', { class: 'lesson-card ' + ls.state },
            h('div', { class: 'lesson-top' }, h('span', { class: 'lesson-num' }, tb.id.slice(1) + '.' + l.num),
              h('span', { class: 'state-chip ' + ls.state }, t('dash.lesson.' + ls.state))),
            h('h4', null, I18n.pick(l.title)),
            h('div', { class: 'bar thin' }, h('div', { class: 'bar-fill', style: { width: pct + '%' } })),
            h('div', { class: 'lesson-foot' }, h('span', null, t('dash.quizzes', { d: ls.subsDone, n: ls.subs })),
              h('span', { class: 'final-st' }, statusIcon(ls.final, 'final:' + l.key, 18), h('span', null, t('dash.final')))));
        });
        return h('div', { class: 'timeline-group' }, h('h4', { class: 'group-title' }, I18n.pick(tb.title)), h('div', { class: 'timeline-grid' }, cards));
      }));

      // activity (last 14 days)
      const days = [], now = new Date();
      for (let i = 13; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i); days.push({ d, n: 0, key: d.toDateString() }); }
      a.attempts.forEach((x) => { const k = new Date(x.at).toDateString(); const dd = days.find((y) => y.key === k); if (dd) dd.n++; });
      const maxN = Math.max(1, ...days.map((x) => x.n));
      bars.replaceChildren(...days.map((x) => h('div', { class: 'bar-col', title: x.d.toLocaleDateString(I18n.lang) + ': ' + x.n },
        h('div', { class: 'bar-v' }, h('i', { style: { height: (x.n / maxN) * 100 + '%' } })), h('span', null, String(x.d.getDate())))));
      activity.querySelector('[data-empty]').style.display = a.attempts.length ? 'none' : '';

      // recent quizzes
      const items = a.attempts.slice(-5).reverse();
      recentList.replaceChildren(...(items.length ? items.map((x) => {
        const q = Course.quizById[x.q];
        return h('li', null, statusIcon(Course.statusOf(q.kind, x.m)), h('span', { class: 'rq' }, quizLabel(x.q)),
          h('b', null, x.m + ' / ' + q.max),
          h('time', null, new Date(x.at).toLocaleDateString(I18n.lang, { day: 'numeric', month: 'short' })));
      }) : [h('li', { class: 'empty' }, t('dash.recent.empty'))]));
    }

    update.floatDeltas = (res) => {                         // "+3" / "▼2" floating over Score and Total mark
      if (!res) return;
      if (res.scoreDelta) floatDelta(scoreAnchor, '+' + res.scoreDelta, true);
      if (res.markDelta) floatDelta(markAnchor, (res.markDelta > 0 ? '+' : '▼') + Math.abs(res.markDelta), res.markDelta > 0);
    };
    return { el, update, floatDeltas: update.floatDeltas };
  }

  window.Dashboard = { mount };
})();
</script>
<script>/* app.js - shell: header (logo, name, tabs, progress ring, Score, Total mark), routing, account menu, dialogs. */
(function () {
  'use strict';
  const { h, icon, ring, counter, field, button, modal, toast, floatDelta, langSwitch } = UI;
  const root = () => document.getElementById('root');
  const fmt = (n) => I18n.num(n);

  const TABS = [{ id: 'dashboard', icon: 'layout-dashboard' }, { id: 't1', icon: 'book-open' }, { id: 't2', icon: 'workflow' }];
  let shell = null;               // {header, main, view, route, dash}

  // ------------------------------------------------------------------ theme
  function applyTheme() {
    const a = Store.current(), th = a ? a.theme : 'auto';
    if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
    else document.documentElement.removeAttribute('data-theme');
  }

  // ------------------------------------------------------------------ routing
  function routeId() {
    const m = (location.hash || '').match(/^#\/(dashboard|t1|t2)\b/);
    return m ? m[1] : 'dashboard';
  }
  function tabTitle(id) { return id === 'dashboard' ? t('tab.dashboard') : I18n.pick(Course.tab(id).title); }

  // ------------------------------------------------------------------ header
  function buildHeader() {
    const a = Store.current();
    const hi = h('button', { class: 'name-chip', type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false', 'aria-label': t('header.menu') },
      h('span', { class: 'avatar' }, (a.first.trim()[0] || a.id[0]).toUpperCase()),
      h('span', { class: 'hi' }, t('header.hi', { name: a.first })), icon('chevron-down'));
    hi.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(hi); });

    const r = ring({ size: 46, stroke: 5, fontSize: 11 });
    const scoreVal = h('b'), markVal = h('b');
    const sc = counter(scoreVal), mk = counter(markVal);
    const scoreBox = h('div', { class: 'metric num-anchor', title: t('dash.score.sub') }, h('span', { class: 'metric-label' }, icon('trophy'), t('header.score')), scoreVal);
    const markBox = h('div', { class: 'metric num-anchor', title: t('dash.mark.sub') }, h('span', { class: 'metric-label' }, icon('target'), t('header.mark')), markVal);
    const progBox = h('div', { class: 'metric prog', title: t('dash.progress.sub') }, r.el, h('span', { class: 'metric-label vert' }, t('header.progress')));

    const tabs = h('nav', { class: 'tabs', role: 'tablist', 'aria-label': t('app.short') },
      TABS.map((tb) => h('a', { class: 'tab', role: 'tab', href: '#/' + tb.id, 'data-tab': tb.id }, icon(tb.icon), h('span', null, tabTitle(tb.id)))));

    const el = h('header', { class: 'topbar' },
      h('div', { class: 'top-row' }, UI.logo(true), h('div', { class: 'menu-wrap' }, hi), h('span', { class: 'grow' }), h('div', { class: 'metrics' }, progBox, scoreBox, markBox)),
      tabs);

    let first = true;
    return {
      el, hi,
      update() {
        const s = Store.stats(Store.current()), tot = s.total;
        r.set(tot.pct, first); sc.set(tot.score, first); mk.set(tot.mark, first); first = false;
        markBox.title = t('dash.mark.sub') + ' — ' + (tot.max ? Math.round((tot.mark / tot.max) * 1000) / 10 : 0) + ' %';
      },
      setActive(id) {
        tabs.querySelectorAll('.tab').forEach((x) => {
          const on = x.dataset.tab === id; x.classList.toggle('on', on); x.setAttribute('aria-selected', String(on));
          if (on) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current');
        });
      },
      deltas(res) {
        if (!res) return;
        if (res.scoreDelta) floatDelta(scoreBox, '+' + res.scoreDelta, true);
        if (res.markDelta) floatDelta(markBox, (res.markDelta > 0 ? '+' : '▼') + Math.abs(res.markDelta), res.markDelta > 0);
      }
    };
  }

  // ------------------------------------------------------------------ account menu
  let openMenu = null;
  function closeMenu() {
    if (!openMenu) return;
    openMenu.el.remove(); openMenu.anchor.setAttribute('aria-expanded', 'false');
    document.removeEventListener('click', closeMenu); document.removeEventListener('keydown', menuKey, true);
    openMenu = null;
  }
  function menuKey(e) { if (e.key === 'Escape') { e.stopPropagation(); const a = openMenu && openMenu.anchor; closeMenu(); if (a) a.focus(); } }

  function toggleMenu(anchor) {
    if (openMenu) return closeMenu();
    const item = (ic, label, fn, danger) => h('button', { class: 'menu-item' + (danger ? ' danger' : ''), role: 'menuitem', type: 'button',
      onclick: () => { closeMenu(); fn(); } }, icon(ic), h('span', null, label));
    const a = Store.current();
    const el = h('div', { class: 'menu', role: 'menu' },
      h('div', { class: 'menu-head' }, h('b', null, a.first + ' ' + a.last), h('small', null, a.id)),
      item('settings', t('menu.settings'), openSettings),
      item('users', t('menu.switch'), openSwitch),
      item('user-plus', t('menu.add'), addAccount),
      item('key-round', t('menu.password'), openChangePassword),
      h('div', { class: 'menu-sep' }),
      item('save', t('menu.save'), openSaveToFolder),
      window.ESP32TOUR_SINGLE ? item('copy', t('menu.appcopy'), downloadAppCopy) : null,
      item('download', t('menu.export'), () => { Store.exportDownload(); toast(t('export.done')); }),
      item('upload', t('menu.import'), importFile),
      h('div', { class: 'menu-sep' }),
      item('log-out', t('menu.signout'), signOut),
      item('trash-2', t('menu.delete'), openDelete, true));
    anchor.parentNode.appendChild(el);
    anchor.setAttribute('aria-expanded', 'true');
    openMenu = { el, anchor };
    setTimeout(() => document.addEventListener('click', closeMenu), 0);
    document.addEventListener('keydown', menuKey, true);
    const f = el.querySelector('.menu-item'); if (f) f.focus();
  }

  // ------------------------------------------------------------------ single-file copy with the accounts inside
  // Rebuilds this very page (scripts + styles + fonts are inline) with the current accounts in #accounts-data.
  function appCopyHtml() {
    const c = document.documentElement.cloneNode(true);
    c.querySelector('#root').replaceChildren();
    c.querySelector('#toasts').replaceChildren();
    c.querySelectorAll('.modal-back, input[type=file]').forEach((n) => n.remove());
    c.removeAttribute('data-theme');
    c.querySelector('#accounts-data').textContent = Store.exportText();
    return '<!doctype html>\n' + c.outerHTML;
  }
  function downloadAppCopy() {
    const url = URL.createObjectURL(new Blob([appCopyHtml()], { type: 'text/html' }));
    const a = h('a', { href: url, download: 'ESP32_Tour_single.html' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(t('appcopy.done'));
  }

  // ------------------------------------------------------------------ dialogs
  function signOut() { Store.signOut(); Auth.show('signin', authOpts()); }
  function authOpts() { return { onDone: enter }; }

  function addAccount() { Auth.show('signup', { adding: true, onDone: enter, onCancel: enter }); }

  function openSettings() {
    const a = Store.current();
    const themeSeg = h('div', { class: 'seg wide', role: 'group' }, ['auto', 'light', 'dark'].map((v) => h('button', {
      type: 'button', class: 'seg-btn' + (a.theme === v ? ' on' : ''), 'aria-pressed': String(a.theme === v),
      onclick: () => { Store.setPrefs(a.uid, { theme: v }); m.close(); openSettings(); }
    }, icon(v === 'auto' ? 'monitor' : v === 'light' ? 'sun' : 'moon'), t('settings.theme.' + v))));
    const langs = h('div', { class: 'seg wide', role: 'group', 'aria-label': t('settings.language') }, ['en', 'fr'].map((l) => h('button', {
      type: 'button', class: 'seg-btn' + (I18n.lang === l ? ' on' : ''), 'aria-pressed': String(I18n.lang === l),
      onclick: () => { Store.setPrefs(a.uid, { lang: l }); I18n.set(l); m.close(); render(); openSettings(); }
    }, icon('languages'), l === 'en' ? 'English' : 'Français')));
    const m = modal({ title: t('settings.title'), body: h('div', { class: 'settings' },
      h('div', { class: 'set-row' }, h('h3', null, t('settings.language')), langs, h('p', { class: 'note' }, t('settings.language.hint'))),
      h('div', { class: 'set-row' }, h('h3', null, t('settings.theme')), themeSeg)) });
  }

  function openSwitch() {
    const cur = Store.current();
    const body = h('div', { class: 'switch' });
    const showList = () => {
      body.replaceChildren(h('p', { class: 'sub' }, t('switch.text')), h('div', { class: 'acct-list' }, Store.accounts().map((a) => h('button', {
        type: 'button', class: 'acct-row', disabled: a.uid === cur.uid, onclick: () => ask(a)
      }, h('span', { class: 'avatar' }, (a.first.trim()[0] || a.id[0]).toUpperCase()),
      h('span', { class: 'acct-chip-text' }, h('strong', null, a.first + ' ' + a.last), h('small', null, a.id)),
      a.uid === cur.uid ? h('span', { class: 'state-chip done' }, t('switch.current')) : null))));
    };
    const ask = (a) => {
      const f = field({ label: t('field.password'), name: 'password', type: 'password', autocomplete: 'off', maxlength: 128 });
      const err = h('div', { class: 'form-err', role: 'alert' });
      const go = button(t('auth.signin.btn'), { type: 'submit', icon: 'log-in' });
      const form = h('form', { class: 'auth-form', novalidate: true }, h('p', { class: 'sub' }, a.first + ' ' + a.last + ' · ' + a.id), f.el, err,
        h('div', { class: 'actions' }, button(t('common.back'), { kind: 'ghost', onclick: showList }), go));
      form.addEventListener('submit', async (e) => {
        e.preventDefault(); f.clear(); err.textContent = '';
        if (!f.value) return f.error('err.required');
        go.setBusy(true);
        try {
          const ok = await Store.verifyAccount(a.uid, f.value);
          if (ok && ok.wait) err.textContent = t('err.wait', { s: ok.wait });
          else if (!ok) err.textContent = t('err.login');
          else { m.close(); Store.startSession(a.uid, false); enter(); }
        } finally { go.setBusy(false); }
      });
      body.replaceChildren(form); f.input.focus();
    };
    const m = modal({ title: t('switch.title'), body });
    showList();
  }

  function openChangePassword() {
    const a = Store.current();
    const fOld = field({ label: t('field.oldpass'), name: 'old', type: 'password', autocomplete: 'current-password', maxlength: 128 });
    const fNew = field({ label: t('field.newpass'), name: 'new', type: 'password', autocomplete: 'new-password', maxlength: 128, hint: t('hint.password') });
    const fNew2 = field({ label: t('field.confirm'), name: 'new2', type: 'password', autocomplete: 'new-password', maxlength: 128 });
    const err = h('div', { class: 'form-err', role: 'alert' });
    const go = button(t('common.save'), { type: 'submit', icon: 'check' });
    const form = h('form', { class: 'auth-form', novalidate: true }, fOld.el, fNew.el, fNew2.el, err,
      h('div', { class: 'actions' }, button(t('common.cancel'), { kind: 'ghost', onclick: () => m.close() }), go));
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); [fOld, fNew, fNew2].forEach((f) => f.clear()); err.textContent = '';
      if (!fOld.value) return fOld.error('err.required');
      if (fNew.value.length < 6) return fNew.error('err.pw.short');
      if (fNew.value !== fNew2.value) return fNew2.error('err.pw.mismatch');
      go.setBusy(true);
      try {
        const r = await Store.changePassword(a.uid, fOld.value, fNew.value);
        if (!r.ok) { (r.err === 'err.pw.old' ? fOld : fNew).error(r.err); return; }
        m.close(); toast(t('pw.done'));
      } finally { go.setBusy(false); }
    });
    const m = modal({ title: t('pw.title'), body: form });
  }

  function openDelete() {
    const a = Store.current();
    const f = field({ label: t('field.password'), name: 'password', type: 'password', autocomplete: 'off', maxlength: 128 });
    const err = h('div', { class: 'form-err', role: 'alert' });
    const go = button(t('common.delete'), { type: 'submit', icon: 'trash-2', kind: 'danger' });
    const form = h('form', { class: 'auth-form', novalidate: true }, h('p', { class: 'sub' }, t('del.text')), f.el, err,
      h('div', { class: 'actions' }, button(t('common.cancel'), { kind: 'ghost', onclick: () => m.close() }), go));
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); f.clear(); err.textContent = '';
      if (!f.value) return f.error('err.required');
      go.setBusy(true);
      try {
        const r = await Store.deleteAccount(a.uid, f.value);
        if (!r.ok) return f.error(r.err);
        m.close(); toast(t('del.done'));
        if (!Store.current()) Auth.show('signin', authOpts());
      } finally { go.setBusy(false); }
    });
    const m = modal({ title: t('del.title'), body: form });
  }

  function openSaveToFolder() {
    const status = h('p', { class: 'note ok-note' }, Store.folderLinked ? [icon('check'), h('span', null, t('save.linked'))] : '');
    const pick = button(t('save.pick'), { icon: 'folder-open', onclick: async () => {
      const r = await Store.saveToFolder();
      if (r === 'linked') { status.replaceChildren(icon('check'), h('span', null, t('save.linked'))); toast(t('save.done')); }
      else if (r === 'download') toast(t('save.unsupported'));
      else if (r === 'error') toast(t('err.generic'), 'error');
    } });
    const dl = button(t('save.download'), { kind: 'ghost', icon: 'download', onclick: () => { Store.downloadAccountsFile(); toast(t('export.done')); } });
    modal({ title: t('save.title'), body: h('div', { class: 'save' }, h('p', { class: 'sub' }, t('save.text')),
      h('div', { class: 'actions left' }, window.showDirectoryPicker ? pick : null, dl), status, h('p', { class: 'note' }, t('save.hint'))) });
  }

  function importFile() {
    const input = h('input', { type: 'file', accept: '.js,.json,.txt', class: 'sr-only' });
    input.addEventListener('change', async () => {
      const f = input.files && input.files[0]; if (!f) return;
      try { const r = Store.importText(await f.text()); toast(t('auth.imported', { n: r.added, m: r.merged })); refresh(); }
      catch (e) { toast(t('auth.import.bad'), 'error'); }
      input.remove();
    });
    document.body.appendChild(input); input.click();
  }

  // ------------------------------------------------------------------ views
  function placeholder(id) {
    const title = tabTitle(id);
    return h('section', { class: 'placeholder' },
      h('div', { class: 'big-icon' }, icon(id === 't1' ? 'book-open' : 'workflow')),
      h('h1', null, t('ph.title')), h('p', null, t('ph.text', { title })),
      h('a', { class: 'btn primary', href: '#/dashboard' }, icon('layout-dashboard'), h('span', null, t('ph.back'))));
  }

  function showRoute() {
    if (!shell) return;
    const id = routeId();
    shell.route = id;
    shell.header.setActive(id);
    document.title = tabTitle(id) + ' · ' + t('app.short');
    if (id === 'dashboard') {
      shell.dash = Dashboard.mount({ onChangePassword: openChangePassword });
      shell.main.replaceChildren(shell.dash.el); shell.dash.update();
    } else { shell.dash = null; shell.main.replaceChildren(placeholder(id)); }
    window.scrollTo(0, 0);
  }

  function refresh() {
    if (!shell || !Store.current()) return;
    shell.header.update();
    if (shell.dash) shell.dash.update();
  }

  // Build the whole signed-in screen
  function render() {
    closeMenu();
    const header = buildHeader();
    const main = h('main', { class: 'main', id: 'main', tabindex: '-1' });
    shell = { header, main, route: null, dash: null };
    root().replaceChildren(h('div', { class: 'app' }, header.el, main,
      h('footer', { class: 'foot' }, t('footer.version', { v: Store.VERSION }),
        Store.versionNote ? ' · ' + t('update.note', { v: Store.versionNote }) : '')));
    header.update(); showRoute();
  }

  function enter() { applyTheme(); render(); }

  const App = {
    boot() {
      Store.init(); I18n.init();
      Store.on((what) => {
        if (what === 'results') refresh();
        if (what === 'prefs') applyTheme();
        if (what === 'accounts' && shell && Store.current()) refresh();
        if (what === 'session' && !Store.current()) { shell = null; applyTheme(); }
      });
      window.addEventListener('hashchange', () => { if (shell) showRoute(); });
      if (Store.current()) enter(); else Auth.show('signin', authOpts());
    },
    // Called by the quiz engine (later) after Store.recordAttempt(): floats "+n" / "▼n" over Score and Total mark
    appCopyHtml,
    showDeltas(res) { if (shell) { shell.header.deltas(res); if (shell.dash) shell.dash.floatDeltas(res); } }
  };
  window.App = App;
  document.addEventListener('DOMContentLoaded', () => App.boot());
})();
</script>
</body>
